services:
  db:
    image: postgres:15-alpine
    container_name: telecom_support_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telecom_support
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # El script SQL (DDL + stored procedure/función) se ejecuta automáticamente
      # la primera vez que se crea el volumen de datos.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: telecom_support_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/telecom_support
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
